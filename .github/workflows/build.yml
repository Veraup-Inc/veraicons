name: build
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install "shapely==2.0.7" svgpathtools cairosvg && npm i -g fantasticon
      - run: cd tools && python3 gen.py && python3 build_packages.py
      - name: Aucun dessin mal formé
        run: cd tools && python3 audit.py | tail -1 | grep -q "^0 signalées"
      # Les styles solid sortent d'opérations géométriques GEOS dont les arrondis
      # varient selon l'OS : on ne compare que les sorties déterministes
      # (styles stroke/duotone/twotone/bulk, manifeste, package Flutter).
      # Les composants React embarquent les tracés solid, ils sont exclus mais
      # leur compilation est vérifiée à l'étape suivante.
      - name: Les fichiers générés doivent être à jour
        run: |
          git diff --exit-code --stat -- \
            svg/stroke-rounded svg/stroke-sharp svg/stroke-standard \
            svg/duotone-rounded svg/duotone-standard svg/twotone-rounded svg/bulk-rounded \
            sprites/stroke-rounded.svg sprites/stroke-sharp.svg sprites/stroke-standard.svg \
            sprites/duotone-rounded.svg sprites/duotone-standard.svg \
            sprites/twotone-rounded.svg sprites/bulk-rounded.svg \
            icons.json tokens.json tools/codepoints.json \
            packages/flutter/veraicons/lib packages/flutter/veraicons/pubspec.yaml \
            || (echo "Lance tools/build.sh et committe le résultat" && exit 1)
      - run: cd packages/react && npm i && npm run build
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - uses: actions/deploy-pages@v4
